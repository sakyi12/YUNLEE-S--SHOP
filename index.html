<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#e8f5e9}
header{background:#1b5e20;color:white;padding:12px;display:flex;gap:10px;align-items:center;position:sticky;top:0;z-index:100}
.logo{font-weight:900;color:#a5d6a7;font-size:20px;white-space:nowrap}
.search-box{flex:1;display:flex;max-width:700px}.search-box input{flex:1;padding:11px;border:none;border-radius:4px 0 0 4px;outline:none;font-size:14px}.search-box button{background:#43a047;color:white;border:none;padding:0 16px;border-radius:0 4px 4px 0;font-weight:bold;cursor:pointer}
.cart-btn{background:#2e7d32;color:white;border:1px solid #a5d6a7;padding:8px 14px;border-radius:4px;cursor:pointer}
.cat-bar{background:#2e7d32;color:white;padding:8px 10px;display:flex;gap:8px;overflow-x:auto;font-size:12px;white-space:nowrap}.cat-bar span{cursor:pointer;background:#388e3c;padding:6px 12px;border-radius:20px;border:1px solid #66bb6a}
.banner{background:#c8e6c9;border:1px solid #43a047;padding:10px;text-align:center;font-size:12px;font-weight:bold;color:#1b5e20}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(175px,1fr));gap:12px;padding:12px;max-width:1400px;margin:auto}
.card{background:white;border-radius:8px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,0.15);display:flex;flex-direction:column;border:1px solid #a5d6a7}.card img{width:100%;height:180px;object-fit:cover;background:#f5f5f5;display:block}
.info{padding:10px;flex:1}.info h4{font-size:13px;line-height:15px;height:32px;overflow:hidden;margin-bottom:4px}.price{color:#1b5e20;font-weight:900;font-size:18px}.old{color:gray;text-decoration:line-through;font-size:12px;margin-left:6px}
.cat{font-size:10px;background:#e8f5e9;color:#0f5dc0;padding:3px 7px;border-radius:4px;display:inline-block;margin-bottom:4px}.stock{font-size:11px;color:#2e7d32;margin-top:4px;font-weight:bold}
.card button{background:#43a047;color:white;border:1px solid #2e7d32;padding:9px;border-radius:20px;margin:10px;font-size:13px;font-weight:bold;cursor:pointer}.card button:hover{background:#1b5e20}
#cartModal{display:none;position:fixed;top:0;right:0;width:400px;max-width:95%;height:100%;background:white;z-index:300;padding:18px;overflow-y:auto;border-left:4px solid #2e7d32}#overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:250}

<body>

<button class="cart-btn" onclick="openCart()">🛒 Cart <span id="cartCount" style="background:#a5d6a7;color:#000;padding:2px 8px;border-radius:12px;font-weight:bold">0</span></button>
</header>
<div class="cat-bar">
<span onclick="filterCat('All')">All Products</span><span onclick="filterCat('Clothes')">👕 Clothes</span><span onclick="filterCat('Phones')">📱 Phones</span><span onclick="filterCat('Motorcycle')">🏍️ Cars/Bikes</span><span onclick="filterCat('Equipment')">🔧 Tools</span><span onclick="filterCat('Toys')">🧸 Toys</span>

<div class="grid" id="catalog"></div>
<div id="overlay" onclick="closeCart()"></div>
<div id="cartModal">
<h2>Shopping Cart</h2><div id="cartItems" style="margin-top:12px"></div><h2 id="total" style="margin:16px 0">Total: GH₵0</h2>

];
let cart_id=[], cart_qty=[], user_hours=[0], currentFilter="All";
setInterval(()=>{user_hours[0]++; let el=document.getElementById("hours"); if(el) el.innerText="Browsing: "+user_hours[0]+"s | "+product_name.length+" products | GH₵";},1000);
function render(){
  let search=document.getElementById("searchInput").value.toLowerCase();
  let html="";
  for(let i=0;i<product_name.length;i++){
    if(currentFilter!="All" && product_category[i]!=currentFilter) continue;
    if(search &&!product_name[i].toLowerCase().includes(search) &&!product_category[i].toLowerCase().includes(search)) continue;
    let oldPrice=(product_price[i]*1.6).toFixed(0);
    html+=`<div class="card">
      <img src="${product_image[i]}" loading="eager" alt="${product_name[i]}" onerror="this.onerror=null; this.src='https://picsum.photos/seed/${i}/400/400'">
      <div class="info">
        <span class="cat">${product_category[i]}</span>
        <h4>[${i}] ${product_name[i]}</h4>
        <p class="price">GH₵${product_price[i].toLocaleString()}<span class="old">GH₵${oldPrice}</span></p>
        <p class="stock">✅ In Stock: ${product_stock[i]} | ID: ${i} | ★ 4.8</p>
      </div>
      <button onclick="addToCart(${i})">Add to Cart</button>
    </div>`;
  }
  document.getElementById("catalog").innerHTML=html;
}
function addToCart(id){
  if(product_stock[id]<=0){alert("Out of stock! stock["+id+"]=0");return;}
  let idx=cart_id.indexOf(id);
  if(idx>=0) cart_qty[idx]++; else {cart_id.push(id); cart_qty.push(1);}
  product_stock[id]--; updateCart(); render();
}
function updateCart(){
  let total=0,cnt=0,html="";
  for(let i=0;i<cart_id.length;i++){
    let id=cart_id[i]; total+=product_price[id]*cart_qty[i]; cnt+=cart_qty[i];
    html+=`<div style="display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #eee;font-size:13px"><div><b>${product_name[id]}</b><br>Qty: ${cart_qty[i]} @ GH₵${product_price[id]}</div><div style="text-align:right">GH₵${(product_price[id]*cart_qty[i]).toLocaleString()} <button onclick="removeCart(${i})" style="background:#c62828;color:white;border:none;border-radius:50%;width:22px;height:22px;cursor:pointer">x</button></div></div>`;
  }
  document.getElementById("cartCount").innerText=cnt;
  document.getElementById("cartItems").innerHTML=html||"<p style='padding:20px;text-align:center;color:gray'>Cart is empty<br>Add items!</p>";
  document.getElementById("total").innerText="Total: GH₵"+total.toLocaleString();
}
function removeCart(i){product_stock[cart_id[i]]+=cart_qty[i]; cart_id.splice(i,1); cart_qty.splice(i,1); updateCart(); render();}
function filterCat(c){currentFilter=c; render();}
function openCart(){document.getElementById("cartModal").style.display="block";document.getElementById("overlay").style.display="block";}
function closeCart(){document.getElementById("cartModal").style.display="none";document.getElementById("overlay").style.display="none";}
function checkout(){if(cart_id.length==0){alert("Cart empty!");return;} alert("✅ ORDER PLACED! Total: "+document.getElementById("total").innerText+" | Browsed: "+user_hours[0]+"s"); cart_id=[];cart_qty=[];updateCart();closeCart();}
render();
